<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<h1>デカ戦2026｜管理者スコア入力</h1>
<div class="sub" id="departmentLabel">beatmania IIDX ガチ部門</div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center">
<select id="departmentSelect" onchange="switchDepartment(this.value)" style="width:auto;min-width:220px">
<option value="enjoy">beatmania IIDX エンジョイ部門</option>
<option value="serious" selected>beatmania IIDX ガチ部門</option>
</select>
<button class="ghost" type="button" onclick="setGithubToken()">管理者トークン設定</button>
<button class="ghost" id="teamTotalsToggle" type="button" onclick="toggleTeamTotals()" aria-pressed="false">合計得点表示</button>
<button class="ghost" onclick="reload()">データ再読み込み</button>
</div>
</header>
<div class="scores">
<div class="score a">TEAM A TOTAL<b id="allA">0 pt</b>
</div>
<div class="score b">TEAM B TOTAL<b id="allB">0 pt</b>
</div>
</div>
<div class="layout">
<aside class="panel">
<h2>試合一覧</h2>
<div id="matches" class="matches">読み込み中...</div>
<button class="ghost" id="summaryButton" style="width:100%;margin-top:12px" onclick="summaryView()">全体集計を見る</button>
</aside>
<main class="panel">
<div id="editor">
<div class="hint">左側の試合一覧から試合を選択してください。</div>
</div>
<div id="summary" class="hidden">
</div>
</main>
</div>
</div>
<div class="toast" id="toast">
</div>
<script src="js/app.js"></script>
</body>
</html>
